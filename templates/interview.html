<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Session | MockMate AI</title>

```
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    body{
        font-family:'Plus Jakarta Sans',sans-serif;
        background:
            radial-gradient(circle at 10% 20%, rgba(59,130,246,0.12) 0%, transparent 30%),
            radial-gradient(circle at 90% 80%, rgba(139,92,246,0.12) 0%, transparent 30%),
            linear-gradient(135deg,#ffffff 0%,#f8fbff 50%,#eef4ff 100%);
        color:#0f172a;
    }

    .glass-card{
        background:rgba(255,255,255,0.88);
        backdrop-filter:blur(20px);
        border:1px solid rgba(255,255,255,0.8);
        box-shadow:
            0 10px 30px rgba(15,23,42,0.08),
            0 25px 60px rgba(59,130,246,0.08);
    }

    .video-container{
        background:#ffffff;
        border-radius:24px;
        border:1px solid rgba(59,130,246,0.12);
        box-shadow:
            0 10px 30px rgba(15,23,42,0.08),
            0 25px 60px rgba(59,130,246,0.08);
        overflow:hidden;
    }

    .gradient-btn{
        background:linear-gradient(135deg,#2563eb,#4f46e5);
        transition:0.3s ease;
    }

    .gradient-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 15px 35px rgba(37,99,235,.25);
    }

    .end-btn{
        background:#fff;
        color:#dc2626;
        border:1px solid rgba(220,38,38,.2);
        transition:.3s;
    }

    .end-btn:hover{
        background:#fee2e2;
    }

    .chat-message{
        background:#eff6ff;
        border:1px solid rgba(59,130,246,.15);
    }

    .chat-area::-webkit-scrollbar{
        width:6px;
    }

    .chat-area::-webkit-scrollbar-thumb{
        background:#cbd5e1;
        border-radius:10px;
    }

    .pulse-red{
        animation:pulse 2s infinite;
    }

    @keyframes pulse{
        0%{opacity:1;}
        50%{opacity:.4;}
        100%{opacity:1;}
    }
</style>
```

</head>

<body class="h-screen flex flex-col p-6">

```
<!-- Header -->
<div class="flex justify-between items-center mb-6">

    <div class="flex items-center gap-3">

        <div class="w-3 h-3 bg-red-500 rounded-full pulse-red"></div>

        <h2 class="text-xl font-bold tracking-tight">
            Interviewing:
            <span class="text-blue-600">{{ role }}</span>
        </h2>

    </div>

    <button id="finish-btn"
            class="end-btn px-6 py-2 rounded-full font-semibold">
        End Interview
    </button>

</div>

<!-- Main Layout -->
<div class="flex-1 grid grid-cols-12 gap-6 overflow-hidden">

    <!-- Video Section -->
    <div class="col-span-8 relative video-container">

        <video id="videoElement"
               class="w-full h-full object-cover scale-x-[-1]"
               autoplay
               muted>
        </video>

        <!-- Mic Button -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2">

            <button id="record-btn"
                    class="gradient-btn p-6 rounded-full shadow-xl active:scale-90">

                <svg id="mic-icon"
                     xmlns="http://www.w3.org/2000/svg"
                     width="28"
                     height="28"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="white"
                     stroke-width="2.5"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" x2="12" y1="19" y2="22"/>

                </svg>

            </button>

        </div>

    </div>

    <!-- Chat Section -->
    <div class="col-span-4 flex flex-col glass-card rounded-[24px] overflow-hidden">

        <div id="chat-log"
             class="flex-1 p-6 space-y-4 overflow-y-auto chat-area">

            <div class="chat-message p-4 rounded-2xl rounded-tl-none">

                <p class="text-sm text-blue-600 font-bold mb-1">
                    AI HR
                </p>

                <p class="text-slate-700">
                    Hello! I'm ready. Whenever you're ready, hold the mic and introduce yourself.
                </p>

            </div>

        </div>

        <div class="p-4 border-t border-slate-200 text-center bg-white/50">

            <p class="text-xs text-slate-500 uppercase tracking-widest font-bold">
                Live Transcript
            </p>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/interview.js') }}"></script>
```

</body>
</html>
