<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
    body{
        font-family:'Plus Jakarta Sans',sans-serif;
        min-height:100vh;
        color:#0f172a;

        background:
            radial-gradient(circle at 10% 20%, rgba(59,130,246,0.12) 0%, transparent 30%),
            radial-gradient(circle at 90% 80%, rgba(139,92,246,0.12) 0%, transparent 30%),
            linear-gradient(135deg,#ffffff 0%,#f8fbff 50%,#eef4ff 100%);
    }

    .glass{
        background:rgba(255,255,255,0.88);
        backdrop-filter:blur(20px);
        border:1px solid rgba(255,255,255,0.8);
        box-shadow:
            0 10px 30px rgba(15,23,42,0.08),
            0 25px 60px rgba(59,130,246,0.08);
    }

    .gradient-text{
        background:linear-gradient(135deg,#2563eb,#7c3aed);
        -webkit-background-clip:text;
        -webkit-text-fill-color:transparent;
    }

    .primary-btn{
        background:linear-gradient(135deg,#2563eb,#4f46e5);
        transition:0.3s ease;
    }

    .primary-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 15px 35px rgba(37,99,235,0.25);
    }

    select{
        background:#fff;
        border:1px solid #dbeafe;
    }

    select:focus{
        outline:none;
        border-color:#2563eb;
        box-shadow:0 0 0 4px rgba(37,99,235,0.12);
    }

    .signup-btn{
        transition:0.3s ease;
    }

    .signup-btn:hover{
        transform:scale(1.05);
    }
</style>
```

        <p class="text-slate-500 mb-8">

        <div class="space-y-4">

            <label class="block text-left text-sm font-semibold text-slate-600">

            </button>

        </div>

    </div>

<script>
    function startInterview() {
        const role = document.getElementById('roleSelect').value;
        window.location.href =
            `/interview?role=${encodeURIComponent(role)}`;
    }
</script>
